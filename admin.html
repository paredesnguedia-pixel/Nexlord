<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXLORD ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#071426;color:#f4f7fb;font:15px system-ui;padding:18px}
main{max-width:900px;margin:auto}
.panel{background:#10223a;border:1px solid #29415d;border-radius:16px;padding:18px;margin:14px 0}
input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;background:#08182b;color:white;border:1px solid #38516e;border-radius:9px}
button{padding:11px 15px;border:0;border-radius:9px;background:#397ee8;color:white;font-weight:bold}
button.danger{background:#b93e50}
.hidden{display:none}
.muted{color:#a9b8ca}
.item{padding:12px;border-bottom:1px solid #29415d}
.password-wrap{position:relative}
.password-wrap input{padding-right:48px}
.toggle-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#9bc4ff;font-size:20px;cursor:pointer;padding:4px;line-height:1}
</style>
</head>
<body>
<main>
<h1>NEXLORD <span class="muted">ADMIN</span></h1>
<p><a href="./" style="color:#9bc4ff">← Retour à la boutique</a></p>

<section id="login" class="panel">
  <h2>Connexion administrateur</h2>
  <div>
    <label>E-mail</label>
    <input id="email" type="email" required>
    
    <label>Mot de passe</label>
    <div class="password-wrap">
      <input id="password" type="password" required>
      <button type="button" class="toggle-eye" id="togglePassword">👁</button>
    </div>
    
    <button type="button" id="loginBtn">Se connecter</button>
  </div>
  <p id="loginMsg" style="margin-top:12px;color:#f87171"></p>
</section>

<div id="app" class="hidden">
  <section class="panel">
    <button id="logout">Déconnexion</button>
    <h2>Tableau de bord</h2>
    <p id="identity" class="muted"></p>
    <p>Produits : <b id="count">0</b></p>
  </section>

  <section class="panel">
    <h2 id="formTitle">Ajouter un produit</h2>
    <form id="productForm">
      <input id="pid" type="hidden">
      <label>Nom *</label>
      <input id="name" required>
      <label>Description</label>
      <textarea id="description"></textarea>
      <label>Prix (FCFA)</label>
      <input id="price" type="number" min="0">
      <label>Catégorie</label>
      <input id="category">
      <label>Photo</label>
      <input id="photo" type="file" accept="image/*">
      <label><input id="published" type="checkbox" checked style="width:auto"> Publier</label>
      <button type="submit">Enregistrer</button>
      <button type="button" id="cancel" class="hidden">Annuler</button>
    </form>
    <p id="formMsg"></p>
  </section>

  <section class="panel">
    <h2>Produits</h2>
    <div id="products">Chargement…</div>
  </section>

  <section id="admins" class="panel hidden">
    <h2>Administrateurs</h2>
    <p>La création de comptes supplémentaires sera activée après installation de la fonction serveur sécurisée.</p>
  </section>
</div>
</main>

<script src="admin.js"></script>
<script>
document.getElementById("togglePassword").addEventListener("click", function () {
  var input = document.getElementById("password");
  if (input.type === "password") {
    input.type = "text";
    this.textContent = "🙈";
  } else {
    input.type = "password";
    this.textContent = "👁";
  }
});
</script>
</body>
</html>
