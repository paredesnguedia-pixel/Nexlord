<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXLORD ADMIN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#071426;color:#f4f7fb;font:15px system-ui}main{max-width:850px;margin:auto}.panel{background:#10223a;border:1px solid #294664;border-radius:16px;padding:20px;margin:16px 0}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border-radius:9px;border:1px solid #36516e;background:#091a2d;color:white}button{padding:12px 18px;border:0;border-radius:9px;background:#2878f0;color:white;font-weight:bold}.secondary{background:#34506e}.hidden{display:none}.msg{white-space:pre-wrap;margin:12px 0}.product{padding:12px;border-bottom:1px solid #294664}
</style></head><body><main><h1>NEXLORD <span style="color:#65a5ff">ADMIN</span></h1>
<section class="panel" id="loginPanel"><h2>Connexion administrateur</h2><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit">Se connecter</button></form><div id="loginMessage" class="msg"></div></section>
<section class="panel hidden" id="adminPanel"><button id="logoutBtn" class="secondary">Déconnexion</button><h2>Ajouter / modifier un produit</h2><form id="productForm"><input id="productId" type="hidden"><label>Nom</label><input id="name" required><label>Description</label><textarea id="description"></textarea><label>Prix (FCFA)</label><input id="price" type="number" min="0" required><label>Catégorie</label><select id="category"><option>Vêtements</option><option>Chaussures</option><option>Ustensiles</option><option>Téléphones</option><option>Informatique</option><option>Accessoires</option><option>Autres</option></select><label>Photo</label><input id="image" type="file" accept="image/*"><label><input id="published" type="checkbox" checked style="width:auto"> Publier</label><br><button type="submit">Enregistrer</button> <button type="button" id="cancelEditBtn" class="secondary">Annuler</button></form><div id="productMessage" class="msg"></div><h3>Produits enregistrés</h3><div id="productsList"></div></section></main></body></html>
